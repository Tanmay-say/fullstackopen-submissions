version: '3.8'

services:
  react-app:
    image: node:20.11.0
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"
    networks:
      - app-network

  json-server:
    image: node:20.11.0
    working_dir: /work
    volumes:
      - .:/work
    ports:
      - "3001:3001"
    command: sh -c "npm install -g json-server && npx json-server --port 3001 --watch db.json"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
